<script>
// ===== RINGIFY v11 HOTFIX 1 =====
(() => {
  'use strict';
  const R = window.R;
  if (!R) return;
  const safe = (name, fn) => { try { fn(); } catch (e) { console.warn('[hotfix ' + name + ']', e); } };
  const css = t => { const s = document.createElement('style'); s.textContent = t; document.head.appendChild(s); };

  // 1) LIKED SONGS: skip missing songs instead of crashing
  safe('liked', () => {
    const LIKED = { id: 'lib:liked', kind: 'playlist', title: 'Liked Songs', name: 'Liked Songs', sub: 'Playlist', href: '/liked', artists: [] };
    try { if (R.ent && R.put && !R.ent('lib:liked')) R.put(LIKED); } catch (e) { window.__dbg && window.__dbg(e); }
    const clean = (r, id) => {
      if (Array.isArray(r)) return r.filter(x => x != null);
      if (r && typeof r === 'object') {
        if (Array.isArray(r.tracks)) r.tracks = r.tracks.filter(x => x != null);
        if (Array.isArray(r.items)) r.items = r.items.filter(x => x != null);
        if (id === 'lib:liked' && 'tracks' in r && (!r.playlist || typeof r.playlist !== 'object')) r.playlist = (R.ent && R.ent('lib:liked')) || LIKED;
      }
      return r;
    };
    const wrap = (obj, key) => {
      const f = obj && obj[key];
      if (typeof f !== 'function' || f._hf) return;
      const g = function (...a) {
        const id = typeof a[0] === 'string' ? a[0] : (a[0] && a[0].id);
        const r = f.apply(this, a);
        return (r && typeof r.then === 'function') ? r.then(v => clean(v, id)) : clean(r, id);
      };
      g._hf = true;
      obj[key] = g;
    };
    ['liked', 'tracksOf', 'playlist', 'recent'].forEach(k => wrap(R.lib, k));
    wrap(R.music, 'load');
  });

  // 2) TV LOGOS + NAMES
  safe('tvlogos', () => {
    const initials = (t) => {
      t = String(t || 'TV');
      const s = (t.replace(/[^\p{L}\p{N} ]/gu, '').trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase() || 'TV').replace(/[<>&"]/g, '');
      let h = 0; for (const c of t) h = (h * 31 + c.charCodeAt(0)) % 360;
      return 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="hsl(' + h + ' 45% 30%)"/><text x="32" y="41" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">' + s + '</text></svg>');
    };
    const artOf = e => {
      let a = e.logo || e.art || e.img || e.image || e.icon || '';
      if (a && typeof a === 'object') a = a.s || a.m || a.l || '';
      if (!a && R.art) { try { a = R.art(e, 's') || ''; } catch (x) { window.__dbg && window.__dbg(x); } }
      return typeof a === 'string' ? a.replace(/^http:\/\//, 'https://') : '';
    };
    const fixRow = row => {
      const id = row.dataset && row.dataset.id;
      if (!id || id.indexOf('tv:') !== 0) return;
      const e = R.ent && R.ent(id);
      if (!e) return;
      const name = e.title || e.name || '';
      const b = row.querySelector('b');
      if (b && !b.textContent.trim() && name) b.textContent = name;
      let img = row.querySelector('img');
      if (!img) { img = document.createElement('img'); row.prepend(img); }
      if (img.dataset.hf === id) return;
      img.dataset.hf = id;
      img.removeAttribute('hidden');
      img.alt = '';
      img.decoding = 'async';
      img.referrerPolicy = 'no-referrer';
      img.onerror = () => { img.onerror = null; img.src = initials(name); };
      img.src = artOf(e) || initials(name);
    };
    let queued = false;
    const scan = () => { queued = false; document.querySelectorAll('#view [data-id^="tv:"]').forEach(fixRow); };
    const mo = new MutationObserver(() => { if (!queued) { queued = true; requestAnimationFrame(scan); } });
    const start = () => { const v = document.getElementById('view'); if (v) mo.observe(v, { childList: true, subtree: true, attributes: true, attributeFilter: ['data-id'] }); };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
    css('#view [data-id^="tv:"] > img{width:44px;height:44px;flex:none;object-fit:contain;border-radius:8px;background:rgba(255,255,255,.06);padding:3px;box-sizing:border-box}');
  });

  // 3) TV FREEZE WATCHDOG: un-sticks frozen live streams
  safe('tvwatch', () => {
    const tv = () => document.getElementById('tv');
    let userPaused = false, lastItem = null, lastT = -1, still = 0, nudges = 0, warned = false;
    document.addEventListener('click', ev => {
      const t = ev.target.closest && ev.target.closest('[data-act]');
      if (!t) return;
      const a = t.dataset.act, v = tv();
      if (a === 'toggle') userPaused = !!(v && !v.paused);
      if (a === 'tv-stop' || a === 'stop') userPaused = true;
    }, true);
    document.addEventListener('keydown', ev => {
      if ((ev.key === ' ' || ev.key === 'k') && !/INPUT|TEXTAREA|SELECT/.test((ev.target && ev.target.tagName) || '')) { const v = tv(); userPaused = !!(v && !v.paused); }
    }, true);
    setInterval(() => {
      const v = tv();
      const p = (R.store && R.store.get && R.store.get('player')) || {};
      if (!v || p.kind !== 'channel') { lastItem = null; return; }
      if (p.item !== lastItem) { lastItem = p.item; userPaused = false; still = 0; nudges = 0; warned = false; lastT = -1; }

        const w = th.dataset.w, v = w === 's' ? S.s : S.e, st = ev.shiftKey ? 10 : 1;
        if (ev.key === 'ArrowLeft' || ev.key === 'ArrowDown') { setW(w, v - st); ev.preventDefault(); }
        else if (ev.key === 'ArrowRight' || ev.key === 'ArrowUp') { setW(w, v + st); ev.preventDefault(); }
        else if (ev.key === 'Home') { setW(w, 0); ev.preventDefault(); }
        else if (ev.key === 'End') { setW(w, S.dur); ev.preventDefault(); }
      }));
      [inS, inE].forEach(inp => {
        const apply = () => { const t = parseT(inp.value); if (Number.isFinite(t)) setW(inp.dataset.w, t); inp.value = fmtT(inp.dataset.w === 's' ? S.s : S.e); };
        inp.addEventListener('change', apply);
        inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') { apply(); inp.blur(); } });
      });
      box.querySelectorAll('.dl-quick [data-q]').forEach(b => b.addEventListener('click', () => {
        const q = b.dataset.q;
        if (q === 'full') { S.s = 0; S.e = S.dur; }
        else if (q === 'now') { let pos = 0; try { pos = R.player.time().pos || 0; } catch (x) { window.__dbg && window.__dbg(x); } S.s = Math.max(0, Math.min(pos, S.dur - MIN)); S.e = S.dur; }
        else { S.e = Math.min(S.dur, S.s + (+q)); if (S.e - S.s < +q) S.s = Math.max(0, S.e - (+q)); }
        render();
      }));
      $('.dl-fadein').addEventListener('change', ev => { S.fade = ev.target.checked; });

      // preview
      $('.dl-prev').addEventListener('click', () => {
        if (prevEl) { stopPrev(); return; }
        try { const p = R.store && R.store.get('player'); if (p && p.playing && R.player.pause) R.player.pause(); } catch (x) { window.__dbg && window.__dbg(x); }
        const a = new Audio(); prevEl = a;
        const ph = $('.dl-ph');
        a.src = srcObj().url;
        a.addEventListener('loadedmetadata', () => { try { a.currentTime = S.s; } catch (x) { window.__dbg && window.__dbg(x); } a.play().catch(() => stopPrev()); }, { once: true });
        a.addEventListener('timeupdate', () => {
          if (!prevEl) return;
          ph.hidden = false; ph.style.left = (a.currentTime / (S.dur || 1) * 100) + '%';
          if (a.currentTime >= S.e) stopPrev();
        });
        a.addEventListener('error', () => { stopPrev(); toast('Preview could not play', { type: 'err' }); });
        $('.dl-prev').textContent = '■ Stop';
      });

      // run
      const backToForm = () => { $('.dl-prog').hidden = true; $('.dl-foot').hidden = false; };
      const go = async () => {
        if (S.busy) return;
        S.busy = true; stopPrev();
        ac = new AbortController();
        const sig = ac.signal;
        const bar = $('.dl-bar i'), stage = $('.dl-stage'), acts = $('.dl-acts');
        const set = (txt, p) => { stage.textContent = txt; if (p != null) bar.style.width = Math.round(Math.max(0, Math.min(1, p)) * 100) + '%'; };
        $('.dl-prog').hidden = false; $('.dl-foot').hidden = true;
        acts.replaceChildren(mkBtn('Cancel', 'btn btn-sec', () => ac.abort()));
        const full = !trimOK() || (S.s <= 0.05 && S.e >= S.dur - 0.05);
        const conv = S.fmt !== 'orig';
        const order = [S.srcs[S.src]].concat(S.srcs.filter((x, i) => i !== S.src));
        try {
          let buf = null, used = null, blocked = 0;
          for (const src of order) {
            try {
              set('Downloading…', 0);
              buf = await fetchBuf(src.url, sig, (p, got) => set('Downloading… ' + (p ? Math.round(p * 100) + '%' : fmtMB(got)), conv ? p * 0.5 : p));
              used = src; break;
            } catch (err) { if (sig.aborted) throw err; if (err && err.name === 'TypeError') blocked++; }
          }
          if (!buf) { const er = new Error(blocked ? 'blocked' : 'failed'); er.blocked = !!blocked; throw er; }
          let ext = extOf(used.url) || (e.kind === 'episode' ? 'mp3' : 'm4a'); if (ext === 'mp4') ext = 'm4a';
          const who = artistsOf(e);
          const nm = clean((who ? who + ' - ' : '') + (e.title || 'audio')) + (full ? '' : ' (' + fmtT(S.s).replace(/:/g, '.') + '-' + fmtT(S.e).replace(/:/g, '.') + ')');
          let blob, name;
          if (!conv) {
            blob = full ? new Blob([buf], { type: MIME[ext] || 'application/octet-stream' }) : new Blob([cutMp3(buf, S.s, S.e, S.dur)], { type: 'audio/mpeg' });
            name = nm + '.' + ext;
          } else {
            set('Preparing audio…', 0.52);
            await new Promise(r => setTimeout(r, 30));
            const audio = await decode(buf); buf = null;
            if (sig.aborted) throw abortErr();
            const sr = audio.sampleRate, ch = Math.min(2, audio.numberOfChannels);
            const a = full ? 0 : Math.floor(S.s * sr), b = full ? audio.length : Math.min(audio.length, Math.ceil(S.e * sr));
            const chans = []; for (let c = 0; c < ch; c++) chans.push(audio.getChannelData(c).slice(a, b));
            fade(chans, sr, S.fade ? 2 : 0.012, S.fade || a > 0, S.fade || b < audio.length);
            if (S.fmt === 'wav') { set('Making WAV…', 0.9); await new Promise(r => setTimeout(r, 30)); blob = encWav(chans, sr); name = nm + '.wav'; }
            else {
              set('Loading MP3 encoder…', 0.58);
              const parts = await encMp3(chans, sr, S.kbps, p => set('Converting to MP3… ' + Math.round(p * 100) + '%', 0.6 + p * 0.36), sig);
              set('Adding song info + cover…', 0.97);
              const tag = await id3(e);
              blob = new Blob(tag.concat(parts), { type: 'audio/mpeg' }); name = nm + '.mp3';
            }
          }
          if (closed) return;
          lastBlob = blob; lastName = name;
          set('✓ Saved "' + name + '" · ' + fmtMB(blob.size), 1);
          saveBlob(blob, name);
          const btns = [mkBtn('Save again', 'btn btn-sec', () => saveBlob(lastBlob, lastName))];
          if (navigator.canShare) btns.push(mkBtn('Share', 'btn btn-sec', async () => {
            try {
              const f = new File([lastBlob], lastName, { type: lastBlob.type });
              if (navigator.canShare({ files: [f] })) await navigator.share({ files: [f], title: lastName });
              else saveBlob(lastBlob, lastName);
            } catch (x) { window.__dbg && window.__dbg(x); }
          }));
          btns.push(mkBtn('New download', 'btn btn-ghost', backToForm));
          acts.replaceChildren(...btns);
        } catch (err) {
          if (sig.aborted || (err && err.name === 'AbortError')) { set('Cancelled', 0); acts.replaceChildren(mkBtn('Back', 'btn btn-sec', backToForm)); }
          else if (err && err.blocked) {
            set('This server doesn\'t let the app read the file, so it can\'t be cut or converted here. You can still open the full original file and save it from your browser (⋮ → Download).', 0);
            acts.replaceChildren(mkBtn('Open original file', 'btn btn-pri', () => window.open(srcObj().url, '_blank', 'noopener')), mkBtn('Back', 'btn btn-sec', backToForm));
          } else {
            set('Download failed: ' + ((err && err.message) || err), 0);
            acts.replaceChildren(mkBtn('Try again', 'btn btn-pri', () => { S.busy = false; go(); }), mkBtn('Back', 'btn btn-sec', backToForm));
          }
        } finally { S.busy = false; }
      };
      $('.dl-go').addEventListener('click', go);
    };
    R.download = { open };

    // entry points: act, key, menus, Now Playing button, episode rows
    try { R.act('download', el => open(hostEnt(el) || current())); } catch (x) { window.__dbg && window.__dbg(x); }
    try { R.keys.bind('shift+d', () => open(current())); } catch (x) { window.__dbg && window.__dbg(x); }
    let menuEnt = null, menuAt = 0;
    const mark = e => { if (e && (e.kind === 'track' || e.kind === 'episode')) { menuEnt = e; menuAt = Date.now(); } };
    document.addEventListener('click', ev => {
      const t = ev.target; if (!t || !t.closest) return;
      if (t.closest('[data-act=dock-more],[data-act=np-more],[data-act=panel-more]')) { mark(current()); return; }
      if (t.closest('[data-act=ent-menu], .tr-more, .qi-more, .card-more')) mark(hostEnt(t));
    }, true);
    document.addEventListener('contextmenu', ev => mark(hostEnt(ev.target)), true);
    document.addEventListener('pointerdown', ev => { const t = ev.target; if (t && t.closest && t.closest('#view, #panel, #libList')) mark(hostEnt(t)); }, true);
    if (R.lib && typeof R.lib.menuFor === 'function') { const mf = R.lib.menuFor; R.lib.menuFor = function (e, ...a) { mark(e); return mf.call(this, e, ...a); }; }
    if (R.menu && typeof R.menu.show === 'function') {
      const ms = R.menu.show;
      R.menu.show = function (at, items, ...rest) {
        try {
          if (Array.isArray(items) && menuEnt && Date.now() - menuAt < 2500 && !items.some(x => x && x._hfdl)) {
            const e = menuEnt;
            const it = { label: 'Download', icon: 'dl', run: () => open(e), _hfdl: true };
            items = items.slice();
            const k = items.findIndex(x => x === '-');
            if (k > 0) items.splice(k, 0, it); else items.push('-', it);
          }
        } catch (x) { window.__dbg && window.__dbg(x); }
        menuEnt = null;
        return ms.call(this, at, items, ...rest);
      };
    }
    const iconBtn = cls => { const b = document.createElement('button'); b.type = 'button'; b.className = cls; b.dataset.act = 'download'; b.title = 'Download'; b.setAttribute('aria-label', 'Download'); b.appendChild(icon()); return b; };
    let q = false;
    const deco = () => {
      q = false;
      const np = document.querySelector('#np .np-tools');
      if (np && !np.querySelector('.hf-dl')) np.appendChild(iconBtn('ibtn hf-dl'));
      document.querySelectorAll('#view .ep[data-id] .ep-ctl:not(.hf-dlx)').forEach(c => { c.classList.add('hf-dlx'); c.appendChild(iconBtn('ibtn sm hf-dl')); });
    };
    new MutationObserver(() => { if (!q) { q = true; requestAnimationFrame(deco); } }).observe(document.body, { childList: true, subtree: true });
    deco();

    css('.dl{display:grid;gap:14px;padding:2px 2px 10px}' +
      '.dl-head{display:flex;gap:14px;align-items:center}' +
      '.dl-art{width:64px;height:64px;border-radius:8px;object-fit:cover;background:rgba(255,255,255,.08);flex:none;box-shadow:0 4px 14px rgba(0,0,0,.35)}' +
      '.dl-meta{min-width:0;display:grid;gap:2px}.dl-meta b{font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}' +
      '.dl-meta small{opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}' +
      '.dl-sec{display:grid;gap:10px;padding:14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07)}' +
      '.dl-sec[hidden],.dl-chips[hidden],.dl-note[hidden],.dl-prog[hidden],.dl-foot[hidden]{display:none!important}' +
      '.dl-lbl{font-size:.72rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;opacity:.6}' +
      '.dl-track{position:relative;height:44px;margin:0 14px;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none}' +
      '.dl-rail,.dl-fill{position:absolute;top:50%;height:6px;margin-top:-3px;border-radius:3px}' +
      '.dl-rail{left:0;right:0;background:rgba(255,255,255,.14)}.dl-fill{background:var(--ac,#1ed760)}' +
      '.dl-ph{position:absolute;top:8px;bottom:8px;width:2px;margin-left:-1px;background:#fff;border-radius:1px;pointer-events:none}' +
      '.dl-th{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:0;padding:0;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.45);touch-action:none;cursor:grab}' +
      '.dl-th::after{content:"";position:absolute;inset:-10px}.dl-th:focus-visible{outline:3px solid var(--ac,#1ed760);outline-offset:2px}' +
      '.dl-track.is-off{opacity:.4;pointer-events:none}' +
      '.dl-times{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}' +
      '.dl-times label{display:grid;gap:4px;font-size:.75rem;opacity:.9}' +
      '.dl-in{width:92px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.25);color:inherit;font-family:inherit;font-size:1rem;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}' +
      '.dl-in:focus{outline:2px solid var(--ac,#1ed760);outline-offset:1px}.dl-in:disabled{opacity:.5}' +
      '.dl-len{font-size:.85rem;opacity:.8;padding-bottom:11px;font-variant-numeric:tabular-nums}' +
      '.dl-chips{display:flex;flex-wrap:wrap;gap:8px}' +
      '.dl-chip{height:36px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:inherit;font-family:inherit;font-size:.85rem;font-weight:700;cursor:pointer;transition:background .15s,transform .1s}' +
      '.dl-chip:active{transform:scale(.96)}.dl-chip:disabled{opacity:.4;cursor:default}' +
      '.dl-chip[aria-pressed=true]{background:var(--ac,#1ed760);color:var(--on-ac,#000);border-color:transparent}' +
      '.dl-note{margin:0;font-size:.8rem;opacity:.72;line-height:1.45}' +
      '.dl-fade{display:flex;align-items:center;gap:10px;font-size:.9rem;padding:0 4px}' +
      '.dl-fade input{width:20px;height:20px;accent-color:var(--ac,#1ed760)}' +
      '.dl-foot{display:flex;align-items:center;gap:12px;padding:4px 0 calc(4px + env(safe-area-inset-bottom))}' +
      '.dl-size{flex:1;font-size:.9rem;opacity:.8}.dl-go{min-width:150px;height:48px;border-radius:999px;font-weight:800}' +
      '.dl-prog{display:grid;gap:12px;padding:16px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07)}' +
      '.dl-bar{height:8px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}.dl-bar i{display:block;height:100%;width:0;background:var(--ac,#1ed760);transition:width .2s}' +
      '.dl-stage{font-size:.9rem;line-height:1.45;overflow-wrap:anywhere}.dl-acts{display:flex;flex-wrap:wrap;gap:8px}.dl-acts .btn{flex:1 1 130px}' +
      '@media (max-width:420px){.dl-in{width:78px}.dl-go{flex:1;min-width:0}.dl-foot{flex-wrap:wrap}}');
  });

  // ---------- 3) SEARCH / BROWSE TILES ----------
  safe('tiles', () => {
    const KEY = 'hf:tileart';
    let map = {};
    try { map = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (x) { window.__dbg && window.__dbg(x); }
    const jobs = []; let running = 0;
    const pump = () => { while (running < 3 && jobs.length) { const f = jobs.shift(); running++; f().catch(() => {}).finally(() => { running--; pump(); }); } };
    const fill = tile => {
      jobs.push(async () => {
        const label = tile.dataset.hfLabel;
        let url = map[label];
        if (!url && R.music && R.music.search) {
          for (const type of ['playlists', 'albums', 'songs']) {
            try {
              const r = await R.music.search(label, type, { limit: 4 });
              const items = (r && (r.items || r.results)) || (Array.isArray(r) ? r : []);
              const it = items.find(x => artOf(x, 'm'));
              if (it) { url = artOf(it, 'm'); break; }
            } catch (x) { window.__dbg && window.__dbg(x); }
          }
          if (url) { map[label] = url; try { localStorage.setItem(KEY, JSON.stringify(map)); } catch (x) { window.__dbg && window.__dbg(x); } }
        }
        if (url) {
          const img = tile.querySelector('.hf-tart');
          if (img) { img.onload = () => tile.classList.add('hf-has-art'); img.src = url; }
        }
      });
      pump();
    };
    const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) { io.unobserve(en.target); fill(en.target); } }), { rootMargin: '200px' }) : null;
    let q = false;
    const scan = () => {
      q = false;
      document.querySelectorAll('#view .tile:not([data-hf-label])').forEach((tile, i) => {
        const label = ((tile.getAttribute('aria-label') || tile.textContent || '').trim().split('\n')[0] || '').trim();
        tile.dataset.hfLabel = label || '-';
        if (!label) return;
        tile.style.setProperty('--hf-i', String(i % 24));
        const img = document.createElement('img');
        img.className = 'hf-tart'; img.alt = ''; img.decoding = 'async'; img.setAttribute('aria-hidden', 'true');
        tile.appendChild(img);
        if (io) io.observe(tile); else fill(tile);
      });
    };
    new MutationObserver(() => { if (!q) { q = true; requestAnimationFrame(scan); } }).observe(document.body, { childList: true, subtree: true });
    css('#view .tile{position:relative;overflow:hidden;isolation:isolate;border-radius:12px;font-weight:800;' +
      'background:linear-gradient(135deg,hsl(var(--h,200) 75% 46%),hsl(calc(var(--h,200) + 38) 70% 24%))!important;' +
      'box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 6px 18px rgba(0,0,0,.25);transition:transform .18s ease,box-shadow .18s ease;' +
      'animation:hfTileIn .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--hf-i,0) * 35ms)}' +
      '#view .tile::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(120% 90% at 0% 0%,rgba(255,255,255,.22),transparent 55%),radial-gradient(80% 60% at 100% 100%,rgba(0,0,0,.35),transparent 70%)}' +
      '#view .tile>*:not(.hf-tart){position:relative;z-index:2;text-shadow:0 1px 8px rgba(0,0,0,.35)}' +
      '#view .tile .hf-tart{position:absolute;right:-10%;bottom:-6%;width:50%;max-width:130px;aspect-ratio:1;object-fit:cover;border-radius:8px;z-index:1;' +
      'transform:rotate(25deg) translate(6%,8%);box-shadow:0 10px 24px rgba(0,0,0,.5);opacity:0;transition:opacity .4s ease,transform .35s ease;pointer-events:none}' +
      '#view .tile.hf-has-art .hf-tart{opacity:1}' +
      '@media (hover:hover){#view .tile:hover{transform:translateY(-3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 12px 28px rgba(0,0,0,.35)}#view .tile:hover .hf-tart{transform:rotate(18deg) translate(0,0) scale(1.06)}}' +
      '#view .tile:active{transform:scale(.97)}' +
      '@keyframes hfTileIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}' +
      '@media (prefers-reduced-motion:reduce){#view .tile{animation:none}#view .tile .hf-tart{transition:none}}');
  });
})();

<script>
// ===== RINGIFY v11 HOTFIX 6: no top gap + tab bars don't cover results (search / radio / podcasts / tv) =====
(() => {
  'use strict';
  const ROUTES = ['search', 'radio', 'podcasts', 'tv'];
  const route = () => document.documentElement.dataset.route || '';
  const on = () => ROUTES.includes(route());

  const st = document.createElement('style');
  const sel = ROUTES.map(r => 'html[data-route=' + r + ']').join(',');
  st.textContent =
    ':is(' + sel + ') #mainHead{display:none!important}' +
    ':is(' + sel + ') #view .page{padding-top:8px!important}' +
    ':is(' + sel + ') #view .page>:first-child{margin-top:0!important}' +
    '#view .hf-sticky{z-index:6!important;padding-top:8px!important;padding-bottom:8px!important;transition:background-color .2s ease,box-shadow .2s ease}' +
    '#view .hf-sticky.hf-stuck{background:var(--hf-bg,#121212)!important;box-shadow:0 0 0 100vmax var(--hf-bg,#121212)!important;clip-path:inset(0 -100vmax 0 -100vmax)!important}';
  document.head.appendChild(st);

  const solid = c => {
    const m = /rgba?\(([^)]+)\)/.exec(c || '');
    if (!m) return false;
    const p = m[1].split(/[\s,\/]+/).filter(Boolean);
    return p.length < 4 || parseFloat(p[3]) >= 0.95;
  };
  const bgOf = el => {
    for (let p = el.parentElement; p; p = p.parentElement) {
      const c = getComputedStyle(p).backgroundColor;
      if (solid(c)) return c;
    }
    const b = getComputedStyle(document.body).backgroundColor;
    return solid(b) ? b : '#121212';
  };
  const scrollerOf = el => {
    for (let p = el.parentElement; p; p = p.parentElement) {
      const oy = getComputedStyle(p).overflowY;
      if ((oy === 'auto' || oy === 'scroll') && p.scrollHeight > p.clientHeight + 1) return p;
    }
    return document.scrollingElement || document.documentElement;
  };
  const isDoc = sc => sc === document.scrollingElement || sc === document.documentElement || sc === document.body;
  const offsetFor = sc => {
    const tb = document.getElementById('topbar') || document.querySelector('.topbar');
    if (!tb) return 0;
    const pos = getComputedStyle(tb).position;
    if (pos !== 'fixed' && pos !== 'sticky') return 0;
    const r = tb.getBoundingClientRect();
    if (!r.height) return 0;
    const top = isDoc(sc) ? 0 : sc.getBoundingClientRect().top;
    return Math.max(0, Math.round(r.bottom - top));
  };

  const watched = new WeakSet();
  const updStuck = () => {
    document.querySelectorAll('#view .hf-sticky').forEach(b => {
      const sc = scrollerOf(b);
      const top = (isDoc(sc) ? 0 : sc.getBoundingClientRect().top) + (parseFloat(b.style.top) || 0);
      const scrolled = isDoc(sc) ? window.scrollY > 0 : sc.scrollTop > 0;
      b.classList.toggle('hf-stuck', scrolled && b.getBoundingClientRect().top <= top + 1);
    });
  };
  let sq = false;
  const onScroll = () => { if (!sq) { sq = true; requestAnimationFrame(() => { sq = false; updStuck(); }); } };

  const fix = () => {
    if (!on()) {
      document.querySelectorAll('#view .hf-sticky').forEach(b => {
        b.classList.remove('hf-sticky', 'hf-stuck');
        ['position', 'top', 'margin-top', 'margin-bottom'].forEach(p => b.style.removeProperty(p));
      });
      return;
    }
    const view = document.getElementById('view');
    if (!view) return;
    const bars = new Set(view.querySelectorAll('.stabs, .page [role=tablist]'));
    view.querySelectorAll('.page > *, .page > * > *, .page > * > * > *').forEach(el => {
      if (getComputedStyle(el).position === 'sticky') bars.add(el);
    });
    bars.forEach(b => {
      if (b.closest('#sheet, #menu, dialog')) return;
      if (b.parentElement && b.parentElement.closest('.hf-sticky')) return;
      const sc = scrollerOf(b);
      b.classList.add('hf-sticky');
      b.style.setProperty('position', 'sticky', 'important');
      b.style.setProperty('top', offsetFor(sc) + 'px', 'important');
      b.style.setProperty('--hf-bg', bgOf(b));

  // ---------- 3) STUDIO: active effects as tidy pills on their own row ----------
  safe('studiohdr', () => {
    const HEAD = '.studio-hdr, .sheet-head, .sh-head, header';
    const bars = new Map();
    const tokens = t => {
      const p = String(t).split(/\s*[·•]\s*/).map(s => s.trim()).filter(Boolean);
      const out = [];
      for (let i = 0; i < p.length; i++) {
        if (/^EQ$/i.test(p[i]) && p[i + 1]) { out.push('EQ: ' + p[i + 1]); i++; }
        else out.push(p[i]);
      }
      return out;
    };
    const isStudio = sh => !!sh.querySelector('.studio-tabs, .studio-hdr, .pads, .fx-sec, .knob-row');
    const findPills = sh => {
      const top = sh.getBoundingClientRect().top;
      const out = [];
      sh.querySelectorAll('*').forEach(el => {
        if (el.closest('.hf-fxbar') || el.children.length > 6) return;
        const t = (el.textContent || '').trim();
        if (!t || t.length > 200 || t.indexOf('·') < 0 || !/(^|[\s·])(EQ|8D)([\s·]|$)/.test(t)) return;
        if (Array.from(el.children).some(c => (c.textContent || '').trim() === t)) return;
        const inHead = !!el.closest(HEAD);
        if (!inHead && el.getBoundingClientRect().top - top > 170) return;

      });

    };

      const bar = document.createElement('div');
      bar.className = 'hf-fxbar';
      bar.innerHTML = '<span class="hf-fxdot" aria-hidden="true"></span><div class="hf-fxchips" role="list" aria-label="Active effects"></div>';
      const chips = bar.querySelector('.hf-fxchips');
      const render = () => {
        const list = tokens(src.textContent || '');
        chips.replaceChildren(...list.map(x => { const s = document.createElement('span'); s.className = 'hf-fxchip'; s.setRole = 0; s.setAttribute('role', 'listitem'); s.textContent = x; return s; }));
        bar.classList.toggle('is-empty', !list.length);
      };
      render();

      mo.observe(src, { subtree: true, childList: true, characterData: true });
      return { bar, mo, src, wrap };
    };
    const run = () => {
      bars.forEach((b, key) => { if (!b.src.isConnected) { b.mo.disconnect(); b.bar.remove(); bars.delete(key); } });
      const sh = document.getElementById('sheet');
      if (!sh || !sh.open || !isStudio(sh)) return;
      findPills(sh).forEach(el => {
        if (bars.has(el)) return;
        const t = (el.textContent || '').trim();
        if (el.closest('button, select, a')) { el.classList.add('hf-fx-clamp'); bars.set(el, { bar: document.createElement('i'), mo: { disconnect() {} }, src: el }); return; }

    };
    let q = false;
    new MutationObserver(() => { if (!q) { q = true; requestAnimationFrame(() => { q = false; run(); }); } })
      .observe(document.documentElement, { subtree: true, childList: true, attributes: true, attributeFilter: ['open'] });
    const st = document.createElement('style');
    st.textContent =
      '.hf-fx-hidden{display:none!important}' +

      '#sheet .studio-hdr{flex-wrap:wrap;row-gap:6px;height:auto!important;min-height:0}' +

      '.hf-fxchips{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;' +
      '-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent);padding-right:18px}' +
      '.hf-fxchips::-webkit-scrollbar{display:none}' +

      'background:rgba(30,215,96,.14);color:var(--ac,#1ed760);border:1px solid rgba(30,215,96,.25)}' +

<script>
// ===== RINGIFY v11 HOTFIX 10: Home recents like "Tamil hits" play instead of "Nothing to play" =====
(() => {
  'use strict';
  const R = window.R;
  if (!R) return;
  const KEY = 'hf:shelves';
  const toastRaw = R.toast;
  const say = (m, o) => { try { toastRaw.call(R, m, o); } catch (e) { void(m); } };
  const entOf = id => { try { return id && R.ent ? R.ent(id) : null; } catch (e) { return null; } };
  const idOf = x => (x && typeof x === 'object') ? x.id : x;

  // ---- remember the songs of each Home row you play from ----
  let store = {};
  try { store = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { store = {}; }
  const persist = () => {
    const keys = Object.keys(store).sort((a, b) => (store[b].at || 0) - (store[a].at || 0));
    keys.slice(20).forEach(k => delete store[k]);
    try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { window.__dbg && window.__dbg(e); }
  };
  const compact = x => {
    const e = typeof x === 'string' ? entOf(x) : x;
    if (!e || !e.id) return null;
    const o = {};
    ['id', 'kind', 'title', 'artists', 'album', 'dur', 'art', 'lang', 'year', 'explicit', 'url', 'show', 'date'].forEach(k => { if (e[k] != null) o[k] = e[k]; });
    return o;
  };
  const saveShelf = (id, title, items) => {
    const list = items.map(compact).filter(Boolean).slice(0, 60);
    if (!list.length) return;
    store[id] = { title: title || '', items: list, at: Date.now() };
    persist();
  };
  const fromStore = id => {
    const rec = store[id];
    if (!rec) return [];
    return rec.items.map(x => {
      const live = entOf(x.id);
      if (live) return live;
      try { if (R.put) { R.put(x); return entOf(x.id) || x; } } catch (e) { window.__dbg && window.__dbg(e); }
      return x;
    }).filter(Boolean);
  };
  const searchSongs = async title => {
    if (!title || !R.music || !R.music.search) return [];
    try {
      const r = await R.music.search(title, 'songs', { limit: 30 });
      const items = (r && (r.items || r.results)) || (Array.isArray(r) ? r : []);
      return items.filter(x => x && x.id);
    } catch (e) { return []; }
  };
  const playList = (items, ctx) => {
    if (R.queue && R.queue.playContext) return R.queue.playContext({ items, index: 0, ctx });
    return R.player.play(items[0], { ctx });
  };
  const titleOfId = id => String(id || '').replace(/^shelf:/, '').trim();

  // ---- rescue: find something real to play ----
  let busy = false;
  const rescue = async info => {
    if (busy) return true;
    const id = info.id || '';
    if (id.indexOf('lp:') === 0 || id === 'lib:liked') return false;
    busy = true;
    try {
      const title = (info.title || titleOfId(id) || '').trim();
      let items = [];
      let ctx = null;
      if (!id || id.indexOf('shelf:') === 0) {
        items = fromStore(id);
        if (!items.length) items = await searchSongs(title);
        ctx = { type: 'shelf', id: id || ('shelf:' + title), title, href: '/search?q=' + encodeURIComponent(title) };
      } else {
        try {
          if (R.music && R.music.load) {
            const r = await R.music.load(id);
            items = ((r && (r.tracks || r.items)) || []).filter(Boolean);
          }
        } catch (e) { window.__dbg && window.__dbg(e); }
        const e = entOf(id);
        if (items.length) ctx = { type: (e && e.kind) || 'playlist', id, title: (e && e.title) || title };
        else {
          items = await searchSongs(title);
          ctx = { type: 'shelf', id: 'shelf:' + title, title, href: '/search?q=' + encodeURIComponent(title) };
        }
      }
      if (!items.length) return false;
      if (info.toastMsg) say('Playing "' + (ctx.title || title) + '"', { type: 'ok' });
      playList(items, ctx);
      return true;
    } finally { busy = false; }
  };

  // ---- 1) save Home-row plays + give them a real link ----
  if (R.queue && typeof R.queue.playContext === 'function') {
    const pc = R.queue.playContext;
    R.queue.playContext = function (a, b, c) {
      try {
        const items = Array.isArray(a) ? a : (a && a.items);
        const ctx = Array.isArray(a) ? ((b && typeof b === 'object' && b.ctx) || (c && typeof c === 'object' && (c.ctx || c))) : (a && a.ctx);
        if (ctx && ctx.type === 'shelf' && ctx.id && Array.isArray(items) && items.length) {
          if (!ctx.title) ctx.title = titleOfId(ctx.id);
          if (!ctx.href) ctx.href = '/search?q=' + encodeURIComponent(ctx.title);
          saveShelf(ctx.id, ctx.title, items);
        }
      } catch (e) { window.__dbg && window.__dbg(e); }
      return pc.apply(this, arguments);
    };
  }

  // ---- 2) library calls for "shelf:" items ----
  if (R.lib) {
    if (typeof R.lib.playEnt === 'function') {
      const pe = R.lib.playEnt;
      R.lib.playEnt = function (e, ...rest) {
        const id = idOf(e);
        if (typeof id === 'string' && id.indexOf('shelf:') === 0) {
          return rescue({ id, title: (e && e.title) || titleOfId(id) }).then(ok => { if (!ok) say('Nothing to play right now. Check your connection and try again.'); });
        }
        return pe.call(this, e, ...rest);
      };
    }
    if (typeof R.lib.tracksOf === 'function') {
      const to = R.lib.tracksOf;
      R.lib.tracksOf = function (e, ...rest) {
        const id = idOf(e);
        if (typeof id === 'string' && id.indexOf('shelf:') === 0) {
          const s = fromStore(id);
          return s.length ? Promise.resolve(s) : searchSongs((e && e.title) || titleOfId(id));
        }
        return to.call(this, e, ...rest);
      };
    }
  }

  // ---- 3) safety net: catch "Nothing to play" right after tapping something ----
  let last = null;
  document.addEventListener('pointerdown', ev => {
    const t = ev.target;
    if (!t || !t.closest || !t.closest('#view, #libList, #panel')) return;
    const host = t.closest('.card, .qp, .lib-it, .tr, [data-id]');
    if (!host) return;
    const idEl = host.dataset.id ? host : (host.querySelector('[data-id]') || host.closest('[data-id]'));
    const tEl = host.querySelector('.card-t, .qp-t, .tr-title, .lib-it b, b, h3, strong');
    last = { id: idEl ? idEl.dataset.id : '', title: ((tEl && tEl.textContent) || '').trim(), at: Date.now() };
  }, true);
  if (typeof R.toast === 'function') {
    R.toast = function (msg, ...rest) {
      try {
        if (typeof msg === 'string' && /nothing to play|no (playable )?(songs|tracks)/i.test(msg) && last && Date.now() - last.at < 6000) {
          const info = Object.assign({ toastMsg: true }, last);
          last = null;
          rescue(info).then(ok => { if (!ok) toastRaw.call(R, msg, ...rest); });
          return;
        }
      } catch (e) { window.__dbg && window.__dbg(e); }
      return toastRaw.call(this, msg, ...rest);
    };
  }
})();

<script>
// ===== RINGIFY v11 HOTFIX 11: karaoke fill goes word-by-word, row-by-row on wrapped lyric lines =====
(() => {
  'use strict';
  const isTransparent = c => !c || c === 'transparent' || /rgba\([^)]*,\s*0(\.0+)?\)$/.test(c);
  const sungColor = line => {
    const box = line.parentElement;
    const past = box && box.querySelector('.ll.is-past');
    if (past) { const c = getComputedStyle(past).color; if (!isTransparent(c)) return c; }
    return document.documentElement.dataset.theme === 'light' ? '#111' : '#fff';
  };
  const holderOf = line => {
    let h = line;
    for (let i = 0; i < 3; i++) {
      const kids = Array.from(h.children);
      const directText = Array.from(h.childNodes).some(n => n.nodeType === 3 && n.textContent.trim());
      if (kids.length === 1 && !directText && !kids[0].classList.contains('hfw')) h = kids[0]; else break;
    }
    return h;
  };
  const wrap = line => {
    const h = holderOf(line);
    if (Array.from(h.children).some(c => !c.classList.contains('hfw'))) return false;
    const text = h.textContent || '';
    if (!text.trim()) return false;
    const frag = document.createDocumentFragment();
    const W = [];
    let cum = 0;
    text.split(/(\s+)/).forEach(part => {
      if (!part) return;
      if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(part)); cum += 0.4; return; }
      const s = document.createElement('span');
      s.className = 'hfw';
      s.textContent = part;
      frag.appendChild(s);
      const len = Math.max(1, Array.from(part).length);
      W.push({ el: s, a: cum, b: cum + len, v: -1 });
      cum += len;
    });
    h.replaceChildren(frag);
    line._hfw = W;
    line._hfTotal = cum || 1;
    line._hfHolder = h;
    line.classList.add('hf-ws');
    line.style.setProperty('--hf-sung', sungColor(line));
    return true;
  };
  const readK = line => {
    let v = line.style.getPropertyValue('--k');
    if (!v) v = getComputedStyle(line).getPropertyValue('--k');
    let k = parseFloat(v);
    if (!Number.isFinite(k)) return NaN;
    if (k > 1.001) k = k / 100;
    return Math.max(0, Math.min(1, k));
  };
  const update = line => {
    if (line.classList.contains('has-w') || line.querySelector('.w')) return;
    if (!line._hfw || !line.classList.contains('hf-ws') || !line.querySelector('.hfw') || (line._hfHolder && !line.contains(line._hfHolder))) {
      line.classList.remove('hf-ws');
      if (!wrap(line)) return;
    }
    const k = readK(line);
    if (!Number.isFinite(k)) { line.classList.remove('hf-k'); return; }
    line.classList.add('hf-k');
    const pos = k * line._hfTotal;
    for (const w of line._hfw) {
      const raw = pos >= w.b ? 1 : pos <= w.a ? 0 : (pos - w.a) / (w.b - w.a);
      const q = Math.round(raw * 100) / 100;
      if (q === w.v) continue;
      w.v = q;
      if (q >= 1) { w.el.classList.add('hf-done'); w.el.style.removeProperty('--wk'); }
      else { w.el.classList.remove('hf-done'); w.el.style.setProperty('--wk', String(q)); }
    }
  };
  let raf = 0;
  const tick = () => {
    raf = 0;
    if (document.hidden) return;
    const lines = document.querySelectorAll('.ll.is-on');
    if (!lines.length) return;
    lines.forEach(l => { try { update(l); } catch (e) { window.__dbg && window.__dbg(e); } });
    raf = requestAnimationFrame(tick);
  };
  const kick = () => { if (!raf && !document.hidden && document.querySelector('.ll.is-on')) raf = requestAnimationFrame(tick); };
  new MutationObserver(kick).observe(document.documentElement, { subtree: true, attributes: true, attributeFilter: ['class'] });
  document.addEventListener('visibilitychange', kick);
  setInterval(kick, 1000);

  const st = document.createElement('style');
  st.textContent =
    '.ll.hf-ws.hf-k,.ll.hf-ws.hf-k *{background-image:none!important;-webkit-background-clip:border-box!important;background-clip:border-box!important;-webkit-text-fill-color:currentColor!important}' +
    '.ll.hf-ws.hf-k.is-on{color:var(--hf-sung,#fff)!important}' +
    '.ll.hf-ws .hfw{display:inline-block;max-width:100%;overflow-wrap:anywhere;color:inherit}' +
    '.ll.hf-ws.hf-k.is-on .hfw{' +
      '-webkit-mask-image:linear-gradient(90deg,#000 calc(var(--wk,0) * 100%),rgba(0,0,0,.4) calc(var(--wk,0) * 100% + .5%));' +
      'mask-image:linear-gradient(90deg,#000 calc(var(--wk,0) * 100%),rgba(0,0,0,.4) calc(var(--wk,0) * 100% + .5%))}' +
    '.ll.hf-ws.hf-k.is-on .hfw.hf-done{-webkit-mask-image:none;mask-image:none}';
  document.head.appendChild(st);
})();
</script>

<script>
// ===== RINGIFY v11 HOTFIX 15: remove the duplicate (overlapped) Studio effects line =====
(() => {
  'use strict';
  const R = window.R;
  if (!R || window.__hf15) return;
  window.__hf15 = true;
  const norm = s => String(s || '').toLowerCase().replace(/\s+/g, ' ').trim();
  const names = () => {
    try {
      const l = R.audio && typeof R.audio.activeList === 'function' ? R.audio.activeList() : null;
      return Array.isArray(l)
        ? l.map(x => typeof x === 'string' ? x : (x && (x.label || x.name || x.title || x.id)) || '').map(norm).filter(Boolean)
        : [];
    } catch (e) { return []; }
  };
  const tick = () => {
    const sh = document.getElementById('sheet');
    if (!sh || !sh.open || !sh.querySelector('.hf-fx2')) return;
    const list = names();
    if (!list.length) return;
    const tabs = sh.querySelector('.studio-tabs');
    const cands = [];
    sh.querySelectorAll('*').forEach(el => {
      if (el.closest('.hf-fx2, svg, .pads, .fx-sec, .studio-tabs, .studio-foot')) return;
      if (!tabs && el.closest('button')) return;
      if (el.matches('[aria-pressed], [role=tab], [data-act=studio-scene], input, select, textarea')) return;
      if (el.querySelector('button, input, select, textarea, .studio-tabs, .pads, .fx-sec, h1, h2, h3')) return;
      if (tabs && !(tabs.compareDocumentPosition(el) & Node.DOCUMENT_POSITION_PRECEDING)) return;
      let t = norm(el.textContent);
      if (!t || t.length > 300) return;
      let hit = 0;
      list.forEach(n => { if (t.includes(n)) { hit++; t = t.split(n).join(' '); } });
      if (!hit) return;
      if (el.matches('button') && hit < 2 && list.length > 1) return;
      if (t.replace(/[·•,|+\-–—\s\d()]/g, '').length > 12) return;
      cands.push(el);
    });
    cands.filter(el => !cands.includes(el.parentElement)).forEach(el => {
      el.classList.add('hf-fxhide');
      el.style.setProperty('display', 'none', 'important');
      [el.previousElementSibling, el.nextElementSibling].forEach(s => {
        if (s && !s.textContent.trim() && !s.matches('button,input,select') && s.getBoundingClientRect().width <= 16) {
          s.style.setProperty('display', 'none', 'important');
        }
      });
    });
  };
  setInterval(() => { try { tick(); } catch (e) { window.__dbg && window.__dbg(e); } }, 600);
})();
</script>

/* v6: hide duplicate PiP/Fullscreen/Streams row once the control bar under the player has them */
(function(){
  var tick=function(){
    try{
      var v=document.getElementById('view'); if(!v) return;
      var bar=v.querySelector('.hf-tvbar'); if(!bar) return;
      var rows=v.querySelectorAll('.tv-layout>div:first-child>.row');
      rows.forEach(function(r){
        if(r.classList.contains('hf-tvbar')) return;
        var btns=r.querySelectorAll('[data-act]'); if(!btns.length){ r.classList.toggle('hf-dup',!r.textContent.trim()); return; }
        var all=true;
        btns.forEach(function(b){ if(!bar.querySelector('[data-act="'+b.getAttribute('data-act')+'"]')) all=false; });
        r.classList.toggle('hf-dup',all);
      });
    }catch(e){ window.__dbg&&window.__dbg(e); }
  };
  setInterval(tick,700);
})();

<script id="ringify-app-compat">
/* Ringify app-compat patch: PiP, fullscreen, downloads, background playback */
(() => {
  'use strict';
  const NB = window.RingifyAndroid || null;           // native bridge (see Android files)
  const $ = s => document.querySelector(s);
  const toast = (m, o) => { try { window.R && R.toast(m, o); } catch (_) {} };
  const stage = () => $('#stage'), tv = () => $('#tv');
  const activeAudio = () => [...document.querySelectorAll('audio[data-deck]')].find(a => a.src && !a.paused) || null;

  /* ---------- DOWNLOADS: blob/<a download> doesn't work in WebView ---------- */
  const b64 = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = rej; r.readAsDataURL(blob); });
  async function saveBlob(blob, name) {
    if (NB && NB.saveFile) {
      try {
        const data = await b64(blob), CH = 512 * 1024;           // chunked to avoid bridge limits
        NB.beginFile(name, blob.type || 'application/octet-stream');
        for (let i = 0; i < data.length; i += CH) NB.appendFile(data.slice(i, i + CH));
        const ok = NB.endFile(); toast(ok ? 'Saved to Downloads: ' + name : 'Save failed', { type: ok ? 'ok' : 'err' }); return ok;
      } catch (e) { toast('Save failed: ' + e.message, { type: 'err' }); return false; }
    }
    try {                                                          // Android Chrome / share sheet
      const f = new File([blob], name, { type: blob.type });
      if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: name }); return true; }
    } catch (e) { if (e.name === 'AbortError') return false; }
    return false;
  }

  HTMLAnchorElement.prototype.click = function () {
    if (this.hasAttribute('download') && /^blob:/.test(this.href)) {

      fetch(href).then(r => r.blob()).then(async b => { if (!(await saveBlob(b, name)) && !NB) origClick.call(this); }).catch(() => origClick.call(this));
      return;
    }
    return origClick.call(this);
  };

  let fake = false;

    fake = on; const s = stage(); if (!s) return;

    document.documentElement.classList.toggle('rg-fs-on', on);

  }

  addEventListener('keydown', e => { if (e.key === 'Escape' && fake) setFake(false); });
  window.__ringifyBack = () => { if (fake) { setFake(false); return true; } return false; };   // call from native onBackPressed

  /* ---------- PICTURE IN PICTURE ---------- */
  async function tvPip() {
    const v = tv(); if (!v) return;
    try {
      if (document.pictureInPictureElement) return await document.exitPictureInPicture();
      if (document.pictureInPictureEnabled && v.requestPictureInPicture) { v.disablePictureInPicture = false; v.removeAttribute('disablepictureinpicture'); return await v.requestPictureInPicture(); }
    } catch (_) {}
    if (NB && NB.enterPip) return NB.enterPip();                   // native Android PiP of whole activity
    toast('Picture-in-picture isn’t available on this device', { type: 'err' });
  }
  async function songPip() {
    // Android WebView has no Document PiP; use native activity PiP (keeps music UI + audio)
    if (NB && NB.enterPip) return NB.enterPip();
    if (window.documentPictureInPicture) return null;              // let the app's own mini player run
    // canvas->video fallback
    try {
      const cv = Object.assign(document.createElement('canvas'), { width: 480, height: 480 });
      const x = cv.getContext('2d'), art = document.querySelector('#np img, .np-art img, img.art');
      const draw = () => { x.fillStyle = '#111'; x.fillRect(0, 0, 480, 480); if (art && art.complete) try { x.drawImage(art, 0, 0, 480, 480); } catch (_) {} };
      draw(); const iv = setInterval(draw, 1000);
      const v = Object.assign(document.createElement('video'), { muted: true, playsInline: true }); v.srcObject = cv.captureStream(2);
      await v.play(); await v.requestPictureInPicture(); v.addEventListener('leavepictureinpicture', () => clearInterval(iv), { once: true });
    } catch (_) { toast('Mini player isn’t supported here', { type: 'err' }); }
  }
  // capture-phase interception so it beats the app's own handlers
  document.addEventListener('click', e => {
    const b = e.target.closest && e.target.closest('[data-act]'); if (!b) return;
    const a = b.dataset.act;
    if (a === 'tv-fullscreen') { e.stopImmediatePropagation(); e.preventDefault(); toggleFs(); }
    else if (a === 'tv-pip') { e.stopImmediatePropagation(); e.preventDefault(); tvPip(); }
    else if (a === 'pip' && NB && NB.enterPip) { e.stopImmediatePropagation(); e.preventDefault(); NB.enterPip(); }
  }, true);

  /* ---------- BACKGROUND PLAYBACK + SPEED ---------- */
  const reapply = () => { try { window.R && R.player && R.player.applyRate && R.player.applyRate(); } catch (_) {} };
  let wl = null;
  async function keepAlive(on) {
    try { NB && NB.setPlaying && NB.setPlaying(!!on); } catch (_) {}                // starts/stops foreground service
    try { if (on && navigator.wakeLock && !wl) { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => wl = null); } else if (!on && wl) { wl.release(); wl = null; } } catch (_) {}
  }
  // resume audio graph / deck if the OS suspended it when the app went to background
  function resumeAll() {
    try { R.audio && R.audio.resume && R.audio.resume(); } catch (_) {}
    try { (window.__ctxs || []).forEach(c => c.state === 'suspended' && c.resume()); } catch (_) {}
  }
  const _AC = window.AudioContext || window.webkitAudioContext;
  if (_AC) { window.__ctxs = []; const P = new Proxy(_AC, { construct(t, a) { const c = new t(...a); window.__ctxs.push(c); return c; } }); window.AudioContext = P; window.webkitAudioContext = P; }

  document.addEventListener('visibilitychange', () => {
    const a = activeAudio();
    if (document.hidden) { resumeAll(); reapply(); if (a && a.paused && window.__wasPlaying) a.play().catch(() => {}); }
    else { resumeAll(); reapply(); }
  });
  document.addEventListener('play', e => { if (e.target.dataset && e.target.dataset.deck) { window.__wasPlaying = true; keepAlive(true); reapply(); } }, true);
  document.addEventListener('pause', e => {
    if (e.target.dataset && e.target.dataset.deck) {
      // OS-forced pause on backgrounding: resume if user didn't pause
      if (document.hidden && window.__wasPlaying && !e.target.ended && window.__userPaused !== true) setTimeout(() => e.target.paused && e.target.play().catch(() => {}), 150);
    }
  }, true);
  document.addEventListener('ratechange', e => { if (e.target.dataset && e.target.dataset.deck) window.__lastRate = e.target.playbackRate; }, true);
  // user intent tracking
  document.addEventListener('click', e => { if (e.target.closest && e.target.closest('[data-act=toggle],[data-act=play],[data-act=pause],[data-act=play-pause]')) { window.__userPaused = !!(activeAudio() && !activeAudio().paused); window.__wasPlaying = !window.__userPaused; if (window.__userPaused) keepAlive(false); } }, true);
  // watchdog: timers are throttled in background, so keep speed + playback in sync
  setInterval(() => {
    const a = activeAudio(); if (!a) return;
    if (window.__lastRate && Math.abs(a.playbackRate - window.__lastRate) > .01) a.playbackRate = window.__lastRate;
    a.preservesPitch = a.mozPreservesPitch = a.webkitPreservesPitch = true;
  }, 1000);
  // media-session actions (lock screen / notification buttons)
  try {
    const ms = navigator.mediaSession;
    if (ms) {
      const h = (n, f) => { try { ms.setActionHandler(n, f); } catch (_) {} };
      h('play', () => { window.__userPaused = false; window.__wasPlaying = true; R.player.toggle(); });
      h('pause', () => { window.__userPaused = true; keepAlive(false); R.player.toggle(); });
      h('previoustrack', () => R.player.prev && R.player.prev());
      h('nexttrack', () => R.player.next && R.player.next());
    }
  } catch (_) {}
  window.__ringifyOnPip = on => document.documentElement.classList.toggle('rg-pip', !!on);  // native calls this
  window.__ringifyHasBridge = !!NB;

  const st = document.createElement('style');
  st.textContent = '#stage.rg-fs{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;z-index:99999!important;background:#000!important;left:0!important;top:0!important}' +
    '#stage.rg-fs video{width:100%!important;height:100%!important;object-fit:contain}' +
    'html.rg-pip nav,html.rg-pip header,html.rg-pip #sheet{display:none!important}';
  document.head.appendChild(st);
})();
</script>
</body>
</html>
